name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.14.0
      - run: npm ci
      - run: npm run release:check
      - run: npm run release:publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists; leaving it unchanged."
            exit 0
          fi

          npm run release:notes > github-release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Cogni $GITHUB_REF_NAME" \
            --notes-file github-release-notes.md \
            --generate-notes
