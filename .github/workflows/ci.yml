name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.14.0
      - run: npm ci
      - run: npm run check

  demos:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.14.0
      - run: npm ci
      - run: npm run verify:demos

  node-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.19.0, 22.23.4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm install --global npm@11.14.0
      - run: npm ci
      - run: npm run check --workspace @inttegro/cogni-client
      - run: npm run check --workspace @inttegro/cogni-server
